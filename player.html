
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Arcade - PSP Player</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10101b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main {
      width: min(90%, 560px);
      padding: 30px 20px;
      box-sizing: border-box;
      background: #1c1c2c;
      border-radius: 18px;
    }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 22px;
      border-radius: 10px;
      background: #7657ff;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover { background: #6041e8; }
    p { color: #c9c9dc; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>🎮 Browser Arcade</h1>
    <h2>PSP Game Player</h2>
    <p>
      Play compatible PSP games in your browser.
      Your game opens in the PPSSPP Web player.
    </p>
    <a href="https://root-hunter.github.io/ppsspp-web/"
       target="_blank" rel="noopener noreferrer">
      Launch PSP Player
    </a>
    <p>
      You will select your own game file in the player.
    </p>
    <p><a href="index.html">← Back to Browser Arcade</a></p>
  </main>
</body>
</html>
